name: oidf-cui
x-actor: &actor
  image: oidf-cui:local
  build: .
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment:
    A_PORT: ${A_PORT:-18766}
  healthcheck:
    test: [CMD, curl, -fsS, "http://localhost:8080/.well-known/openid-federation"]
    interval: 10s
    timeout: 3s
    retries: 10
  depends_on:
    init:
      condition: service_completed_successfully
services:
  init:
    image: oidf-cui:local
    build: .
    user: "0"
    entrypoint: ["sh", "-c", "java -jar /app/app.jar init && chown -R 10001:10001 /material"]
    volumes:
      - a-data:/material/a
      - b-data:/material/entity-b
      - c-data:/material/entity-c
      - anchor-data:/material/trust-anchor
  entity-a:
    <<: *actor
    command: [docs]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8080/openapi.json"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      B_PORT: ${B_PORT:-18767}
      C_PORT: ${C_PORT:-18768}
      TA_PORT: ${TA_PORT:-18769}
    ports: ["127.0.0.1:${A_PORT:-18766}:8080"]
    networks: [default, entry]
    volumes: [a-data:/data, "./inbox:/inbox:ro"]
  entity-b:
    <<: *actor
    command: [serve, entity-b]
    ports: ["127.0.0.1:${B_PORT:-18767}:8080"]
    networks: [default, entry]
    volumes: [b-data:/data:ro]
  entity-c:
    <<: *actor
    command: [serve, entity-c]
    ports: ["127.0.0.1:${C_PORT:-18768}:8080"]
    networks: [default, entry]
    volumes: [c-data:/data:ro]
  trust-anchor:
    <<: *actor
    command: [serve, trust-anchor]
    ports: ["127.0.0.1:${TA_PORT:-18769}:8080"]
    networks: [default, entry]
    volumes: [anchor-data:/data:ro]
volumes:
  a-data:
  b-data:
  c-data:
  anchor-data:
networks:
  entry:
    ipam:
      config:
        - subnet: ${A_SUBNET:-10.203.190.0/24}
  default:
    internal: true
    ipam:
      config:
        - subnet: ${CUI_SUBNET:-10.203.188.0/24}
